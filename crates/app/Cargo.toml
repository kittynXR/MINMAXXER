[package]
name = "minmaxxer"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
minmaxxer-core = { path = "../core" }
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["json", "query", "tokio", "http1", "multipart"] }
fontdue = "0.9"
getrandom = "0.3"
openvr = "0.9"
rusqlite = { version = "0.39", features = ["bundled", "chrono"] }
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
